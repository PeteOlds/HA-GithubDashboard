[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "homeassistant-devops-bridge"
version = "0.2.0"
description = "Read-only multi-account GitHub integration for Home Assistant (DevOps Bridge)."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Pete Olds" }]
keywords = ["home-assistant", "hacs", "github", "integration"]
classifiers = [
    "Framework :: Home Assistant",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-aiohttp>=1.0",
    "pytest-cov>=5.0",
    "aioresponses>=0.7",
    "homeassistant==2026.5.*",
    "pytest-homeassistant-custom-component>=0.13",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.setuptools]
packages = ["custom_components.devops_bridge"]

[tool.setuptools.package-data]
"custom_components.devops_bridge" = ["*.json", "translations/*.json"]

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["custom_components"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["homeassistant"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
files = ["custom_components/devops_bridge", "tests"]
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["homeassistant.*", "aiohttp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --durations=10"
filterwarnings = ["ignore::DeprecationWarning"]